name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, unit/integration tests with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # TESTING.md §4 requires the enforcement decision to be recorded here: the coverage
      # thresholds block merges. They are defined in vitest.config.ts (80% overall, 90% for auth,
      # the storage/data layer and core domain logic), and this command fails when any is missed.
      # It runs the whole unit/integration suite, so there is no separate `pnpm test` step.
      - run: pnpm test:coverage

  e2e:
    name: Playwright accessibility & visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e
      - run: pnpm test:visual
